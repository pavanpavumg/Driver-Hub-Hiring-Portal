<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="dhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#116b54"/>
      <stop offset="100%" stop-color="#1ea882"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Premium Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#dhGrad)"/>

  <!-- Subtle Steering Arc / Dynamic Road Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.18" stroke-dasharray="7 5"/>

  <!-- Active Status / Acceleration Pulse Indicator -->
  <circle cx="48" cy="16" r="3.5" fill="url(#accentGrad)"/>
  <circle cx="48" cy="16" r="5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Brand Signature "DH" -->
  <text x="32" y="36.5" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DM Sans', Manrope, sans-serif" 
        font-size="25" 
        font-weight="900" 
        letter-spacing="-1.2" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="middle">DH</text>
</svg>
